---
layout: default
---
<article class="container page">
  <header class="page-head">
    {% if page.eyebrow %}<p class="eyebrow eyebrow--accent">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="page-body{% if page.reading %} reading{% endif %}{% if page.wide %} page-body--wide{% elsif page.reading %} measure{% endif %}">
    {{ content }}
  </div>
</article>
