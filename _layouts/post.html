---
layout: default
---
<article class="container post">
  <div class="measure">
    <header class="page-head">
      <p class="eyebrow">{{ page.date | date: "%b %-d, %Y" }} · Archived</p>
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
      <p class="post__note">From earlier work — part of my <a href="{{ '/archive/' | relative_url }}">archive</a> of foundational machine-learning &amp; data-science projects.</p>
    </header>

    <div class="reading">
      {{ content }}
    </div>

    <hr>
    <p class="post__back"><a href="{{ '/archive/' | relative_url }}">← Back to the archive</a></p>
  </div>
</article>
